# dark-memory-mcp — operator-reproducible CI recipe
#
# PUBLISHED: this repository is PUBLIC at
# github.com/Opita-Code/dark-memory-mcp. The old "NEVER-PUSH / there is
# no git remote" note was RETIRED 2026-10-08 by operator decision and was
# factually wrong: a remote existed and had been public since 2026-07.
# The recipe stays committed for transparency, so a cloner can run it:
#
#   $env:DARK_MEM_MCP_BIN = "$PWD/cmd/dark-mem-mcp/dark-mem-mcp.exe"
#   go test ./... -count=1 -timeout 240s
#   DARK_MEM_MCP_BIN=$env:DARK_MEM_MCP_BIN go test ./tests/wire/... -count=1 -timeout 90s
#   pwsh -File scripts/lint-no-private-projects.ps1
#
# Replace `DARK_MEM_MCP_BIN` with the actual binary path on your
# platform (the snippet above assumes Windows; on Linux/macOS swap
# the .exe suffix).
#
# If you DO push this repo to GitHub and want CI to run, copy this
# file to .github/workflows/ci.yml (it is excluded from the operator
# lint and the production checklist by design — see CONTRIBUTING.md
# H-4: lint-no-private-projects must remain silent).
#
# The 4 stages match docs/PRODUCTION_CHECKLIST.md §CI recipe:
#
#   1. build    — go build ./... (parent module + cmd/dark-mem-mcp submodule)
#   2. unit     — go test ./... (15 packages; wire tests skip on missing binary)
#   3. wire     — go test ./tests/wire/... with DARK_MEM_MCP_BIN (10 tests)
#   4. lint     — private-project name lint (CI guard for CONTRIBUTING H-4)
#
# Each stage fails the run on non-zero exit. The wire stage is the
# authoritative production-readiness gate (CONTRIBUTING.md H-3).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (parent + cmd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: go build (parent module)
        run: go build ./...
      - name: go build (cmd/dark-mem-mcp)
        run: |
          cd cmd/dark-mem-mcp
          go build -o ./dark-mem-mcp ./

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: go test ./...
        run: go test ./... -count=1 -timeout 240s

  wire:
    name: wire conformance (production gate)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: build binary for wire tests
        run: |
          cd cmd/dark-mem-mcp
          go build -o ./dark-mem-mcp ./
      - name: wire tests with DARK_MEM_MCP_BIN
        env:
          # t6 (spec 1242, 2026-08-18): the boot path is single-binary
          # legacy (the only mode). The wire conformance suite talks
          # MCP JSON-RPC directly to that path on stdio. There is no
          # dispatcher routing or bridge binary involved.
          DARK_MEM_MCP_BIN: ${{ github.workspace }}/cmd/dark-mem-mcp/dark-mem-mcp
        run: go test ./tests/wire/... -count=1 -timeout 90s -v

  lint:
    name: lint (no private project names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint-no-private-projects (sh)
        run: bash scripts/lint-no-private-projects.sh

  # B2-D Phase 0 (alpha-exit Postgres parity program, 2026-10-15):
  # add a Postgres service and run a smoke test that boots the Store
  # implementation against a live pg container. No stubs are exercised
  # yet — the goal is to prove the CI pipeline is live so subsequent
  # phases can rely on it as the gate for stub-filling PRs.
  #
  # The existing dual_driver tests stay skipped because we run a single
  # test by `-run TestPhase0_Smoke_PostgresBoot`; the rest of the
  # dual_driver package is unmatched and not invoked. Future phases
  # will add more dual-driver jobs (contract after methods land) or
  # flip the unit job's DARK_TEST_POSTGRES_DSN to run the full suite
  # once stubs are filled (cf. spec 2011).
  postgres-smoke:
    name: postgres smoke (B2-D Phase 0)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dark
          POSTGRES_PASSWORD: dark-test
          POSTGRES_DB: dark_mem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dark -d dark_mem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: dual-driver smoke + phase1 implementations against live pg
        env:
          DARK_TEST_POSTGRES_DSN: postgres://dark:dark-test@127.0.0.1:5432/dark_mem?sslmode=disable
        # Phase 0 (boot smoke, ci.md:8 commit ef2723d) + Phase 1
        # (19 notImpl replacements: Constitution/Mod/ActiveSession/
        # ActiveSubagent/BrandGuide). Future phases extend this regex
        # with TestPhase2_*, TestPhase3_*, etc.
        run: go test ./tests/dual_driver/ -run 'TestPhase0_Smoke_PostgresBoot|TestPhase1_.*' -count=1 -v -timeout 240s