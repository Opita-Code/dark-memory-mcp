name: publish-mcp-registry

on:
  push:
    tags:
      - "v*"
  # v2.7.1: deterministic ordering via workflow_run. Fires AFTER
  # publish-npm completes (any conclusion). We branch on conclusion
  # below to skip the publish step if publish-npm failed (no point
  # looking up a version that doesn't exist on npm).
  #
  # Both triggers still go through the same retry-loop safety net;
  # workflow_run gives us deterministic ordering so the retry usually
  # succeeds on attempt 1 (npm has already propagated by the time we
  # fire). The retry is the safety net for manual workflow_dispatch
  # reruns and any future cross-workflow trigger surprises.
  workflow_run:
    workflows: ["publish-npm"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (for re-publishing without tag push, e.g. after server.json fix)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write  # For OIDC auth with the Official MCP Registry

jobs:
  publish:
    name: Publish to Official MCP Registry
    # Skip the entire job if we were triggered by workflow_run and the
    # upstream publish-npm job failed — registry can't look up a version
    # that was never published. Push-tag and workflow_dispatch paths
    # always run (they're explicit operator actions).
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          # Three trigger paths:
          # - push:tags: v*           — GITHUB_REF = refs/tags/vX.Y.Z  → VERSION = X.Y.Z
          # - workflow_dispatch       — operator passes -f version=X.Y.Z
          # - workflow_run (v2.7.1)   — fires AFTER publish-npm completion.
          #                              GITHUB_REF here is the workflow
          #                              file's branch (main). We must
          #                              reach into the upstream event to
          #                              find the original tag. We try
          #                              multiple payload fields in order
          #                              of reliability.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            SOURCE="workflow_dispatch input"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Try the most informative field first: workflow_run.head_branch.
            # For tag push triggers, GitHub puts the tag name in
            # head_branch (NOT head_ref — head_ref is empty for tags).
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            HEAD_REF="${{ github.event.workflow_run.head_ref }}"
            UPSTREAM_EVENT="${{ github.event.workflow_run.event }}"
            echo "DEBUG workflow_run.head_branch=$HEAD_BRANCH"
            echo "DEBUG workflow_run.head_ref=$HEAD_REF"
            echo "DEBUG workflow_run.event=$UPSTREAM_EVENT"
            if [[ "$HEAD_BRANCH" == v* ]]; then
              VERSION="${HEAD_BRANCH#v}"
              SOURCE="workflow_run head_branch (tag)"
            elif [[ "$HEAD_REF" == refs/tags/v* ]]; then
              VERSION="${HEAD_REF#refs/tags/v}"
              SOURCE="workflow_run head_ref"
            elif [[ "$HEAD_BRANCH" == */* ]]; then
              # branch-style ref like "main" — not a tag, defensive
              VERSION=""
              SOURCE="workflow_run non-tag branch (skip)"
            else
              VERSION=""
              SOURCE="workflow_run unknown shape"
            fi
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            SOURCE="push tag GITHUB_REF"
          fi
          if [ -z "$VERSION" ]; then
            # workflow_run fired on a non-tag upstream (e.g. a branch
            # push to v2.8.0-alpha re-pushed the bump commit). The
            # version can't be extracted from a non-tag ref; skip
            # cleanly so the job doesn't fail.
            echo "::warning::workflow_run upstream was not a tag push; skipping publish"
            echo "VERSION=" >> "$GITHUB_OUTPUT"
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "SKIP=false" >> "$GITHUB_OUTPUT"
          echo "Trigger: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Resolved VERSION: $VERSION (source: $SOURCE)"

      - name: Verify server.json version matches tag
        if: steps.version.outputs.SKIP != 'true'
        run: |
          PACKAGE_VERSION=$(node -p "require('./server.json').version")
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::server.json version ($PACKAGE_VERSION) does not match git tag (${{ steps.version.outputs.VERSION }})"
            exit 1
          fi
          echo "server.json version $PACKAGE_VERSION matches tag"

      - name: Validate server.json schema basics
        if: steps.version.outputs.SKIP != 'true'
        run: |
          # Lightweight validation: server.json must have name, version,
          # packages array, and each package must have identifier.
          node -e "
            const s = require('./server.json');
            if (!s.name || !s.name.startsWith('io.github.Opita-Code/')) {
              console.error('server.json: invalid name: ' + s.name);
              process.exit(1);
            }
            if (!s.version) { console.error('server.json: missing version'); process.exit(1); }
            if (!Array.isArray(s.packages) || s.packages.length === 0) {
              console.error('server.json: packages must be a non-empty array');
              process.exit(1);
            }
            for (const p of s.packages) {
              if (!p.registryType || !p.identifier || !p.version) {
                console.error('server.json: package missing required field');
                process.exit(1);
              }
              if (!p.transport || p.transport.type !== 'stdio') {
                console.error('server.json: transport.type must be stdio');
                process.exit(1);
              }
            }
            console.log('server.json schema validation passed');
          "

      - name: Resolve latest mcp-publisher version
        if: steps.version.outputs.SKIP != 'true'
        id: publisher-version
        run: |
          # The mcp-publisher has no `latest` symlink; we have to query
          # the GitHub API for the most recent release tag_name.
          # https://github.com/modelcontextprotocol/registry/releases/latest
          LATEST=$(curl -sSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | jq -r '.tag_name')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::Failed to resolve latest mcp-publisher version"
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest mcp-publisher version: $LATEST"

      - name: Download mcp-publisher CLI
        if: steps.version.outputs.SKIP != 'true'
        run: |
          set -euo pipefail
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          VERSION="${{ steps.publisher-version.outputs.version }}"
          URL="https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_${OS}_${ARCH}.tar.gz"
          echo "Downloading $URL"
          curl -sSL "$URL" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Login to Official MCP Registry (GitHub OIDC)
        if: steps.version.outputs.SKIP != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Check if version already published in MCP Registry (idempotency)
        if: steps.version.outputs.SKIP != 'true'
        id: check-exists
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          # Query the registry's search endpoint. Returns 200 with a `servers`
          # array containing one entry per published version of our server.
          # Each entry: { server: {version: "X.Y.Z", ...}, _meta: { ... } }
          HTTP_CODE=$(curl -s -o /tmp/registry.json -w "%{http_code}" \
            "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.Opita-Code/dark-memory-mcp" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Unexpected HTTP $HTTP_CODE from registry; will attempt publish"
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Check if our specific version is in the response. Iterate through
          # the servers array and check each .server.version.
          if jq -e --arg v "$VERSION" '
            (.servers // []) | map(.server.version) | index($v) != null
          ' /tmp/registry.json > /dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION already in MCP Registry; skipping publish"
          else
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not yet in registry; will publish"
          fi

      - name: Publish to Official MCP Registry
        if: steps.version.outputs.SKIP != 'true'
        if: steps.check-exists.outputs.EXISTS != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Retry loop for npm-registry propagation race conditions.
          #
          # Two trigger paths converge here:
          # (a) push:tags: v* — fires in parallel with publish-npm.
          #     npm CDN may not have propagated yet when this fires.
          # (b) workflow_run on publish-npm completed — fires AFTER
          #     publish-npm's publish step succeeded. npm CDN HAS
          #     propagated. First attempt usually succeeds.
          # (c) workflow_dispatch — manual operator rerun. Same as (a).
          #
          # The retry budget covers path (a)/(c). Path (b) almost always
          # succeeds on attempt 1; the retry is a no-op safety net.
          #
          # v2.6.1 retry: 3 × 30s = 90s worst case. v2.7.1 bump per
          # agent_memory id=93 follow-up: 5 × 60s = 300s worst case,
          # which comfortably covers npm's 5-30s CDN propagation plus
          # the longest historical flake (~180s in v2.6.0 publish).
          MAX_ATTEMPTS=5
          RETRY_DELAY=60
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::mcp-publisher publish (attempt $attempt/$MAX_ATTEMPTS, trigger=${{ github.event_name }})"
            if ./mcp-publisher publish; then
              echo "::endgroup::"
              echo "Published on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Publish failed (likely npm-registry propagation race). "\
                "Sleeping ${RETRY_DELAY}s before retry $((attempt+1))/$MAX_ATTEMPTS..."
              sleep $RETRY_DELAY
            fi
          done
          echo "::error::mcp-publisher publish failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Confirm registry entry is live
        run: |
          sleep 5  # Allow registry to propagate
          curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.Opita-Code/dark-memory-mcp" | head -c 500
          echo
