name: publish-npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for `npm publish --provenance` (SLSA build attestation)

jobs:
  build-and-publish-platform:
    name: Build ${{ matrix.npm-platform }} + publish platform package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - npm-platform: darwin-x64
            goos: darwin
            goarch: amd64
            binary-name: dark-mem-mcp
          - npm-platform: darwin-arm64
            goos: darwin
            goarch: arm64
            binary-name: dark-mem-mcp
          - npm-platform: linux-x64
            goos: linux
            goarch: amd64
            binary-name: dark-mem-mcp
          - npm-platform: linux-arm64
            goos: linux
            goarch: arm64
            binary-name: dark-mem-mcp
          - npm-platform: win32-x64
            goos: windows
            goarch: amd64
            binary-name: dark-mem-mcp.exe
          - npm-platform: win32-arm64
            goos: windows
            goarch: arm64
            binary-name: dark-mem-mcp.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from git tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        working-directory: npm/platform-${{ matrix.npm-platform }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match git tag (${{ steps.version.outputs.VERSION }})"
            exit 1
          fi
          echo "package.json version $PACKAGE_VERSION matches tag"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cross-compile dark-mem-mcp binary for ${{ matrix.npm-platform }}
        working-directory: cmd/dark-mem-mcp
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p ../../npm/platform-${{ matrix.npm-platform }}/bin
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/dark-agents/dark-memory-mcp/internal/version.buildVersion=${{ steps.version.outputs.VERSION }}" \
            -o ../../npm/platform-${{ matrix.npm-platform }}/bin/${{ matrix.binary-name }} \
            .
          echo "Built $(ls -la ../../npm/platform-${{ matrix.npm-platform }}/bin/${{ matrix.binary-name }})"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Smoke-test node --check on index.js
        working-directory: npm/platform-${{ matrix.npm-platform }}
        run: node --check index.js

      - name: Publish platform package to npm
        working-directory: npm/platform-${{ matrix.npm-platform }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm publish --access public --provenance
        # --provenance attaches an SLSA build attestation generated by
        # GitHub Actions. npm verifies the publish came from a trusted
        # CI run, so a leaked token cannot publish arbitrary binaries.

  publish-wrapper:
    name: Publish main npm wrapper
    runs-on: ubuntu-latest
    needs: build-and-publish-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from git tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify wrapper package.json version matches tag
        working-directory: npm/wrapper
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::wrapper package.json version ($PACKAGE_VERSION) does not match git tag (${{ steps.version.outputs.VERSION }})"
            exit 1
          fi

      - name: Verify all optionalDependencies exist on npm at this version
        working-directory: npm/wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          node -e "
            const pkg = require('./package.json');
            const opts = pkg.optionalDependencies || {};
            for (const [name, version] of Object.entries(opts)) {
              console.log('checking ' + name + '@' + version);
            }
          "

      - name: Smoke-test node --check on wrapper index.js
        working-directory: npm/wrapper
        run: node --check index.js

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Publish main wrapper to npm
        working-directory: npm/wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm publish --access public --provenance
